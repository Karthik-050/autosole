services:
  jenkins:
    build:
      context: ./jenkins
    image: project-k-jenkins:local
    container_name: project-k-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    group_add:
      - "0"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./nginx/runtime:/deployment-config
      - ../../new-automator/repos:/workspace/repos
    networks:
      - project-k-deploy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12

  deployment-proxy:
    image: nginx:latest
    container_name: project-k-deployment-proxy
    restart: unless-stopped
    ports:
      - "5002:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/runtime:/etc/nginx/project-k
    networks:
      - project-k-deploy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  jenkins_home:
    name: jenkins_home
    external: true

networks:
  project-k-deploy:
    name: project-k-deploy
